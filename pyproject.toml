[project]
name = "mytinytransformer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "pyyaml>=6.0.3",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
